name: Hausaufgaben
options:
  bundleIdPrefix: de.schule
  deploymentTarget:
    iOS: "16.0"
targets:
  Hausaufgaben:
    type: application
    platform: iOS
    sources:
      - path: Hausaufgaben.swiftpm/MyApp.swift
      - path: Hausaufgaben.swiftpm/Models.swift
      - path: Hausaufgaben.swiftpm/TaskListView.swift
      - path: Hausaufgaben.swiftpm/WeekView.swift
      - path: Hausaufgaben.swiftpm/FocusView.swift
      - path: Hausaufgaben.swiftpm/Untis.swift
      - path: Hausaufgaben.swiftpm/UntisView.swift
      - path: Resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Hausaufgaben
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.schule.hausaufgabenplaner
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
